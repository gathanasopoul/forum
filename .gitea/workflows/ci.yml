name: Go CI Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # As per your README, but using a recent stable version

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        # CGO_ENABLED is required for go-sqlite3
        run: CGO_ENABLED=1 go test -v ./...

      - name: Build application
        # CGO_ENABLED is required for go-sqlite3
        # The output binary will be named 'forum'
        run: CGO_ENABLED=1 go build -o forum cmd/server/main.go

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' # Only run on main branch
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/forum:latest

