{{define "content"}}
<div class="form-container">
    <div class="form-card post-form-card">
        <h2 class="form-title">Start a New Discussion</h2>
        <p class="form-subtitle">Share your knowledge or ask a question in the community</p>

        <form action="/create-post" method="POST" class="post-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="What is this discussion about?" required autofocus>
            </div>

            <div class="form-group">
                <label>Select Categories</label>
                <div class="checkbox-chips">
                    {{range .Categories}}
                        <label class="chip-label">
                            <input type="checkbox" name="categories" value="{{.}}">
                            <span class="chip-text">#{{.}}</span>
                        </label>
                    {{end}}
                </div>
            </div>

            <div class="form-group">
                <label for="content">Description</label>
                <textarea id="content" name="content" placeholder="Provide background context, code snippets, or details here..." rows="10" required></textarea>
            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-regular fa-paper-plane"></i> Publish Post
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
