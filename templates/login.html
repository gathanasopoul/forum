{{define "content"}}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Login to your account to join the discussions</p>

        <form action="/login" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <p class="form-footer-link">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>
{{end}}
