{{define "content"}}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Login to your account to join the discussions</p>

        <form action="/login" method="POST" class="auth-form">
            {{if .Form.Error}}
            <div class="error-msg" style="margin-bottom: 1rem; text-align: center; color: var(--danger-color);">
                <i class="fa-solid fa-triangle-exclamation"></i> {{.Form.Error}}
            </div>
            {{end}}
            
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" value="{{.Form.Email}}" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="oauth-buttons" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <div style="text-align: center; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Or continue with</div>
            <a href="/auth/github/login" class="btn btn-outline btn-full" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
        </div>

        <p class="form-footer-link" style="margin-top: 1.5rem;">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>
{{end}}
